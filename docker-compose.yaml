version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: studyworks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zhu88jie
      POSTGRES_DB: studyworks
    ports:
      - "5432:5432"
